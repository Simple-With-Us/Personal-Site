name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Required fleet and snapshot files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/EFFORT-LOG.md
          test -f static/index.html
          test -f scripts/sync-effort-issues.py
          test -f .github/workflows/effort-issues-sync.yml
          test -f start/vercel.json
          test -f start/api/rag-snapshot.js
          test -f start/site-snapshot.json
          test -f scripts/build-rag-snapshot.mjs

      - name: About copy uses past tense
        run: grep -F "Earlier work included" static/index.html

      - name: Datadog fail-closed instrumentation
        run: node scripts/verify-datadog.mjs

      - name: Sentry browser instrumentation
        run: node scripts/verify-sentry.mjs

      - name: Infisical sole-source-of-truth contract
        run: node scripts/verify-infisical-sot.mjs

      - name: Sentry CI reporter alignment
        run: python3 scripts/verify-sentry-ci-report.py

      # The start site is a second application in this repository:  the static
      # `start/` tree served by its own Vercel project, with its own deployment
      # boundary, its own handlers and the RAG snapshot it serves.
      - name: Start site boundary, handler and snapshot tests
        run: node --test tests/deployment-boundary.test.cjs tests/rag-hits.test.mjs tests/admin-api.test.cjs tests/quota-groups.test.cjs tests/start-site-identity.test.cjs
