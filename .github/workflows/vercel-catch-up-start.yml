name: Vercel production catch-up (start)

# The catch-up publisher for start.jays.services.  It is the deliberate
# backstop for the start site, and it is shaped exactly like the main site's
# catch-up next to it:  the deploy job is gated on the repository variable
# VERCEL_CATCH_UP_ENABLED, which is unset by default, so this workflow runs its
# test job and skips the deploy.  That is intentional.  The start site's day to
# day publisher is Vercel's own Git integration, which builds and deploys the
# `start/` subtree of this repository's main branch.
#
# To hand publishing to this workflow instead, disable Git deployments on the
# Vercel project (the gate refuses to deploy while a competing Git publisher is
# enabled) and set VERCEL_CATCH_UP_ENABLED to true.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - start/**
      - scripts/deploy/**
      - .github/workflows/vercel-catch-up-start.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-production-catch-up-start
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/deploy/vercel-catch-up.test.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VERCEL_CATCH_UP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_ORG_ID: team_l3mWAejl1E08y8ijku5DpBE6
      VERCEL_PROJECT_ID: prj_mb1aSPLMPQyZFNXOnQI92wjyub5l
      VERCEL_TELEMETRY_DISABLED: '1'
      VERCEL_CONFIG_PATH: scripts/deploy/vercel-config.start.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Load deploy token from shared Fleet-OPS secret scope
        env:
          INFISICAL_PROJECT_ID: 8dae6d03-8f12-48b2-adf3-e5c1b881c8c5
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_SECRET_PATH: /
          INFISICAL_NAMES: VERCEL_TOKEN
          INFISICAL_REQUIRED: VERCEL_TOKEN
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_AUTOMATION_CLIENT_SECRET }}
        run: node scripts/infisical-fetch.mjs
      - name: Check binding, deployed SHA, cooldown and exact-main CI
        id: gate
        run: node scripts/deploy/vercel-catch-up.mjs prepare
      - name: Install pinned Vercel CLI
        if: steps.gate.outputs.deploy == 'true'
        run: npm install --global vercel@64.5.0
      - name: Pull project settings and build from repo root
        if: steps.gate.outputs.deploy == 'true'
        run: |
          vercel pull --yes --environment=production
          vercel build --prod --yes
      - name: Recheck main, publisher binding and 3h window before upload
        if: steps.gate.outputs.deploy == 'true'
        id: recheck
        run: node scripts/deploy/vercel-catch-up.mjs
      - name: Deploy once and verify provider receipt
        if: steps.recheck.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes --json \
            --meta fleetCommitSha="$(git rev-parse HEAD)" \
            --meta githubCommitSha="$(git rev-parse HEAD)" \
            --meta githubCommitRef=main > "$RUNNER_TEMP/vercel-deployment.json"
          node scripts/deploy/vercel-catch-up.mjs receipt "$RUNNER_TEMP/vercel-deployment.json"
