name: Mirror live site

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Fetch live site
        run: |
          rm -rf tmp-mirror
          wget --recursive --level=2 --convert-links --adjust-extension \
            --page-requisites --no-parent \
            --domains=jays.services,jaywedgeworth.grok.me \
            --directory-prefix=tmp-mirror \
            -e robots=off \
            https://jays.services/ || echo "::warning::wget reported errors; validating fetch output before touching static/"
          # Never wipe static/ unless the fetch produced a usable mirror.
          # A failed fetch must fail the run, not publish an empty site.
          if [ ! -s tmp-mirror/jays.services/index.html ]; then
            echo "::error::mirror fetch failed: tmp-mirror/jays.services/index.html missing or empty; leaving static/ untouched"
            exit 1
          fi
          rm -rf static
          mkdir -p static
          cp -r tmp-mirror/jays.services/* static/
          rm -rf tmp-mirror
          
          # Restore updated app icons from git so they aren't overwritten by outdated live site assets
          git checkout HEAD -- static/app-icons/

          # Live Vercel can lag this repo. Keep landed About tense + Doximity view URL + project blurbs.
          python3 - <<'PY'
          from pathlib import Path
          replacements = [
              ("Earlier work includes ", "Earlier work included "),
              ("https://www.doximity.com/cv/jaywedgeworth", "https://www.doximity.com/profiles/3cb95815-2fd1-4985-94e5-3d6f932283bf/view"),
              ("Local-first agentic trading dashboard with multi-user workflows, broker adapters, SEC/RAG research, and plan-tier data controls.", "A trading console for real broker accounts.  Live at SocraticTrade.com."),
              ("Congressional trading intelligence: latency-aware market data, filters, delivery pipelines, and web + iOS surfaces.", "A public dashboard of STOCK Act disclosures from the House, Senate, and Executive Branch.  Web at Congress.Trade, plus iOS."),
              ("Real-time disclosure tracking for Congressional and Executive stock trading.", "A public dashboard of STOCK Act disclosures from the House, Senate, and Executive Branch.  Web at Congress.Trade, plus iOS."),
              ("Usage, balances, credits, and costs across 30+ API providers — projections, import, and polished web + iOS surfaces.", "Tracks usage, balances, credits, and costs across the services you use.  Web at usage.jays.services, plus iOS."),
              ("AI cost, token, and quota monitoring for multi-agent fleets.", "Tracks usage, balances, credits, and costs across the services you use.  Web at usage.jays.services, plus iOS."),
              ("Pokémon listing desk for finding mispriced cards on eBay and Mercari.", "A Pokémon listing desk.  Scan eBay and Mercari Buy It Now singles, then score asks against TCGPlayer and other marketplaces.  Native Android and iOS.  Web at DealDex.net."),
              ("Dynamic secret rotation and cryptographic credential lifecycle manager.", "Dynamic secret rotation and cryptographic credential lifecycle manager across clouds and local keychains.  Native macOS and iOS.  The public web host is not live yet."),
              ("Address book logo enricher with human-in-the-loop review.", "Brand icons for your address book.  You review each match before it is written.  Available on macOS, iOS, and the web.  Site at ContactLogo.com."),
          ]
          root = Path("static")
          if not root.is_dir():
              raise SystemExit(0)
          for path in list(root.rglob("*.html")) + list(root.rglob("*.js")):
              text = path.read_text(errors="replace")
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  print("preserved copy in", path)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update static mirror of live site $(date -u +%Y-%m-%d)"
            git push
          fi
