name: Regenerate Start Baselines

# TEMPORARY.  The start site's visual baselines are compared against a render
# made on the GitHub runner image,  and this machine renders the same page three
# pixels shorter,  so a baseline regenerated here would not match the one CI
# compares against.  This job regenerates them where they are compared.
#
# It runs on the branch that carries the copy change,  uploads the new PNGs as
# an artifact,  and is deleted in the next commit.

on:
  push:
    branches: ["feature/live-rag-panel"]

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.start.config.ts --update-snapshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: start-baselines
          path: site/tests/start-e2e/dashboard-visual.spec.ts-snapshots/
          retention-days: 7
